
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Car Listings</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>

    <nav class="nav-home">
        <a href="javascript:void(0);" class="hamburger-menu" onclick="toggle()">
            <i class="fa fa-bars"></i>
        </a>
        <a href="{{ url_for('home') }}" class="logo">CarListings</a>
        <div class="home-links" id="links">
            <a href="{{ url_for('buy') }}">Buy</a>
            <a href="{{ url_for('sell') }}">Sell</a>
            <a href="{{ url_for('contact') }}">Contact</a>
            <a href="{{ url_for('register') }}">Register</a>
            <a href="{{ url_for('login') }}">Login</a>
        </div>
    </nav>

    <div class="login-container">

        <h2>Welcome Back</h2>
        <p>Log in to access your account.</p>

        <form action="{{ url_for('login') }}" method="POST">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="pass">Password</label>
                <input type="password" id="pass" name="pass"
                       placeholder="Enter your password" required>
            </div>

            <button type="submit">Login</button>

        </form>

        <p class="register-link">
            Don't have an account?
            <a href="{{ url_for('register') }}">Register</a>
        </p>

    </div>

</body>
</html>
