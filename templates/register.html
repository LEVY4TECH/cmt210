
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Car Listings</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='register.css') }}">
</head>
<body>

    <nav class="nav-home">
        <a href="javascript:void(0);" class="hamburger-menu" onclick="toggle()">
            <i class="fa fa-bars"></i>
        </a>
        <a href="{{ url_for('home') }}" class="logo">CarListings</a>
        <div class="home-links" id="links">
            <a href="{{ url_for('buy') }}">Buy</a>
            <a href="{{ url_for('sell') }}">Sell</a>
            <a href="{{ url_for('contact') }}">Contact</a>
            <a href="{{ url_for('register') }}">Register</a>
            <a href="{{ url_for('login') }}">Login</a>
        </div>
    </nav>

    <div class="register-container">

        <h2>Create Account</h2>
        <p>Join us and start buying or selling vehicles.</p>

        <form action="{{ url_for('register') }}" method="POST">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
            </div>

            <div class="form-group">
                <label for="pass">Password</label>
                <input type="password" id="pass" name="pass" placeholder="Create a password" required>
            </div>

            <div class="form-group">
                <label for="role">Account Type</label>
                <select id="role" name="role" required>
                    <option value="user">Buyer</option>
                    <option value="seller">Seller</option>
                </select>
            </div>

            <button type="submit">Register</button>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="{{ url_for('login') }}">Log in</a>
        </p>

    </div>

</body>
</html>
